<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Safari 27.2 — date, time, and color inputs</title>
    <link rel="stylesheet" href="./accname/fixture.css" />
  </head>
  <body>
    <main>
      <h1>Date, time, and color</h1>
      <p>
        Native controls with visible labels. On iOS, Safari 27.2 identifies these as pop-up
        buttons for VoiceOver. Record the spoken role on each platform. Do not replace them
        with custom widgets because an older build announced them differently.
      </p>
      <form>
        <p><label for="when-date">Visit date</label> <input id="when-date" type="date" /></p>
        <p><label for="when-time">Visit time</label> <input id="when-time" type="time" /></p>
        <p><label for="swatch">Swatch color</label> <input id="swatch" type="color" /></p>
      </form>
    </main>
  </body>
</html>
