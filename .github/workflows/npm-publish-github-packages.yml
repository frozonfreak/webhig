# Requires NPM_TOKEN: Classic Automation or Granular token with 2FA bypass (not Publish+OTP).
# EOTP in logs → see packages/PUBLISHING.md § "Why EOTP in GitHub Actions"

name: Publish npm packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"

          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must be vX.Y.Z. Got: $TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing @web-hig packages version $VERSION"

      - name: Verify npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN repository secret is missing"
            exit 1
          fi

          echo "Authenticated npm user:"
          npm whoami

      - name: Verify package versions
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          test "$(tr -d '\r\n' < VERSION)" = "$VERSION"

          for pkg in \
            packages/core/package.json \
            packages/cli/package.json \
            packages/install/package.json
          do
            node --input-type=module -e "
              import fs from 'node:fs';

              const pkg =
                JSON.parse(fs.readFileSync('$pkg', 'utf8'));

              if (pkg.version !== '$VERSION') {
                console.error(
                  '$pkg version',
                  pkg.version,
                  'does not match release version',
                  '$VERSION'
                );
                process.exit(1);
              }
            "
          done

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Pre-publish checklist (dry-run)
        run: |
          echo "Publish order: @web-hig/core → @web-hig/install → @web-hig/cli (dependencies rewritten)"
          echo "VERSION file matches release tag; npm run validate and npm test passed above."
          echo "See packages/PUBLISHING.md if npm returns 404 or EOTP."

      - name: Run tests
        run: npm test

      - name: Publish @web-hig/core
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish @web-hig/install
        working-directory: packages/install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Publish @web-hig/cli
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm pkg set \
            "dependencies[@web-hig/core]=${{ steps.version.outputs.version }}" \
            "dependencies[@web-hig/install]=${{ steps.version.outputs.version }}"
          npm install --omit=dev
          npm publish --access public
