verbose = "info"
no_progress = true
max_concurrency = 8
timeout = 20
retry_wait_time = 2
max_retries = 3
user_agent = "Mozilla/5.0 (compatible; WebHIG-LinkCheck/1.0; +https://github.com/frozonfreak/webhig)"
accept = ["200", "204", "206", "301", "302", "307", "308"]
scheme = ["https", "http"]
include_mail = false
exclude_all_private = true
include_fragments = "none"
exclude = [
  '^https://twitter\.com/',
  '^https://x\.com/',
  '^https://linkedin\.com/',
  '^https://www\.linkedin\.com/',
  '^https://www\.npmjs\.com/',
  '^https://example\.com',
  '^https://…',
]
